<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 130" width="100%" height="100%">
  <defs>
    <linearGradient id="gmChipDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#42A5F5"/>
      <stop offset="60%" stop-color="#1E88E5"/>
      <stop offset="100%" stop-color="#0D47A1"/>
    </linearGradient>
    <linearGradient id="gmArcDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#43A047"/>
      <stop offset="100%" stop-color="#66BB6A"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Microchip & Connectivity Icon -->
  <g transform="translate(6, 15) scale(0.48)">
    <!-- Arcos de Conexao -->
    <path d="M 120 20 A 100 100 0 0 1 220 120" fill="none" stroke="url(#gmArcDark)" stroke-width="9" stroke-linecap="round"/>
    <circle cx="220" cy="120" r="9" fill="#43A047"/>
    <circle cx="120" cy="20" r="7" fill="#66BB6A"/>

    <path d="M 120 220 A 100 100 0 0 1 20 120" fill="none" stroke="#29B6F6" stroke-width="9" stroke-linecap="round"/>
    <circle cx="120" cy="220" r="9" fill="#29B6F6"/>
    <circle cx="20" cy="120" r="7" fill="#64B5F6"/>

    <!-- Vias Internas -->
    <path d="M 66 66 A 76 76 0 0 1 120 44" fill="none" stroke="#64B5F6" stroke-width="5.5" stroke-linecap="round"/>
    <path d="M 174 174 A 76 76 0 0 1 120 196" fill="none" stroke="#43A047" stroke-width="5.5" stroke-linecap="round"/>

    <!-- Chip Central -->
    <rect x="86" y="86" width="68" height="68" rx="14" ry="14" fill="url(#gmChipDark)"/>
    <rect x="98" y="98" width="44" height="44" rx="8" ry="8" fill="#0A1C33" stroke="#90CAF9" stroke-width="1.5"/>
    <circle cx="120" cy="120" r="4.5" fill="#43A047"/>

    <!-- Pinos Norte -->
    <rect x="100" y="70" width="6" height="16" rx="3" fill="#64B5F6"/>
    <rect x="117" y="68" width="6" height="18" rx="3" fill="#64B5F6"/>
    <rect x="134" y="70" width="6" height="16" rx="3" fill="#64B5F6"/>

    <!-- Pinos Sul -->
    <rect x="100" y="154" width="6" height="16" rx="3" fill="#1E88E5"/>
    <rect x="117" y="154" width="6" height="18" rx="3" fill="#1E88E5"/>
    <rect x="134" y="154" width="6" height="16" rx="3" fill="#1E88E5"/>

    <!-- Pinos Oeste -->
    <rect x="70" y="100" width="16" height="6" rx="3" fill="#64B5F6"/>
    <rect x="68" y="117" width="18" height="6" rx="3" fill="#64B5F6"/>
    <rect x="70" y="134" width="16" height="6" rx="3" fill="#64B5F6"/>

    <!-- Pinos Leste -->
    <rect x="154" y="100" width="16" height="6" rx="3" fill="#43A047"/>
    <rect x="154" y="117" width="18" height="6" rx="3" fill="#43A047"/>
    <rect x="154" y="134" width="16" height="6" rx="3" fill="#43A047"/>
  </g>

  <!-- Tipografia Vetorial de Alta Legibilidade -->
  <text x="136" y="38" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="2" fill="#90CAF9">LPTI TECH &bull; SOLUÇÕES EMPRESARIAIS</text>
  
  <text x="136" y="84" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="48" font-weight="800" letter-spacing="-0.5">
    <tspan fill="#FFFFFF">Gestor</tspan>
    <tspan dx="8" fill="#43A047">MEI</tspan>
  </text>
  
  <text x="138" y="110" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" letter-spacing="0.3" fill="#B0BEC5">Software de Gestão Empresarial, Vendas e Finanças</text>
</svg>