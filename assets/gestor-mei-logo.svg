<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 140" width="100%" height="100%">
  <defs>
    <linearGradient id="gmlgNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1E3C"/>
      <stop offset="100%" stop-color="#040D1A"/>
    </linearGradient>
    <linearGradient id="gmlgBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2196F3"/>
      <stop offset="50%" stop-color="#1976D2"/>
      <stop offset="100%" stop-color="#0D47A1"/>
    </linearGradient>
    <linearGradient id="gmlgGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#66BB6A"/>
      <stop offset="100%" stop-color="#2E7D32"/>
    </linearGradient>
    <filter id="gmlgGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Simbolo Oficial Gestor MEI -->
  <g transform="translate(10, 10)">
    <!-- Container Shield / Rounded Box com Sombra -->
    <rect x="0" y="0" width="120" height="120" rx="26" fill="url(#gmlgNavy)" stroke="rgba(255,255,255,0.14)" stroke-width="2"/>
    
    <!-- Anel de Crescimento Superior -->
    <path d="M 60 22 A 38 38 0 0 1 98 60" fill="none" stroke="url(#gmlgGreen)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="98" cy="60" r="4.5" fill="#66BB6A"/>

    <!-- Anel Tecnologico Inferior -->
    <path d="M 60 98 A 38 38 0 0 1 22 60" fill="none" stroke="url(#gmlgBlue)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="60" cy="98" r="4.5" fill="#2196F3"/>

    <!-- Isotipo "G" Estilizado com Barras de Metricas / Crescimento -->
    <g transform="translate(36, 36)">
      <!-- Barra 1 (Base/Estoque) -->
      <rect x="0" y="24" width="8" height="24" rx="4" fill="#42A5F5"/>
      <!-- Barra 2 (Vendas/Caixa) -->
      <rect x="13" y="12" width="8" height="36" rx="4" fill="#1976D2"/>
      <!-- Barra 3 (Lucro/Crescimento) -->
      <rect x="26" y="0" width="8" height="48" rx="4" fill="url(#gmlgGreen)"/>
      <!-- Arco horizontal conectando a letra G -->
      <path d="M 2 24 C 2 6 42 6 44 22 C 44 32 34 34 26 34" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Tipografia Oficial Corporativa -->
  <g transform="translate(150, 48)">
    <!-- Titulo Principal -->
    <text x="0" y="32" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5px" fill="#0D47A1">
      GESTOR <tspan fill="#1976D2">MEI</tspan>
    </text>
    <!-- Tagline Oficial Padronizada -->
    <text x="2" y="60" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="700" letter-spacing="1px" fill="#2E7D32" text-transform="uppercase">
      ERP Inteligente para MEIs e Pequenos Negócios
    </text>
    <text x="2" y="80" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" letter-spacing="0.2px" fill="#64748B">
      LPTI Tech — Desenvolvido por Leônidas Paulino
    </text>
  </g>
</svg>
